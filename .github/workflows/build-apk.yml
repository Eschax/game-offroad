name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Locate and Rename APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/low-range-offroad-4x4-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: low-range-offroad-4x4-debug-apk
          path: release-apk/low-range-offroad-4x4-debug.apk

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: Low Range Offroad 4x4 Android APK (v1.0.0)
          body: |
            ## Low Range Offroad 4x4 Mobile (Android APK)
            
            Unduh file `.apk` di bawah dan install di smartphone Android Anda untuk memainkan game!
            
            ### Fitur Utama:
            - **4 Kendaraan 4x4 Realistis**: Jeep Rubicon, Isuzu D-Max, Nissan Patrol, RAM Heavy Duty.
            - **Suspensi Interaktif Aktif**: Naik-turun suspensi real-time (*Low / Normal / High*) dan kekakuan (*Soft / Firm*).
            - **Offroad Mekanik**: 2WD/4H/4L Gearbox, Diff Lock, Air Down PSI ban, Derek Winch, dan Checkpoint BBM.
            - **Medan & Tantangan Berkontur**: Lumpur, salju, batu tebing, jembatan balok kayu, dan water crossing.
          files: release-apk/low-range-offroad-4x4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
